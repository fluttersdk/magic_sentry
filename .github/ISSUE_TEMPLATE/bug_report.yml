name: Bug Report
description: Report a bug in magic_sentry
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Reporting bugs are easier to fix when we know what
        Sentry received, so say whether the event, breadcrumb or user reached
        your Sentry project at all, and paste its event id if one did.
        Never paste your DSN.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        For example:
        1. Wrap `main()` in `MagicSentry.run(configure: configureSentry, appRunner: _boot)`
        2. Register `SentryServiceProvider` in `lib/config/app.dart`
        3. Trigger a request that answers 500 through `Http.get`
        4. Observe what reaches Sentry
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - MagicSentry.run (boot, zone, error widget breadcrumb)
        - SentryServiceProvider (wiring)
        - SentryNetworkInterceptor (HTTP events and breadcrumbs)
        - SentryUserContext (scope user and tags)
        - SentryTokenScrubber (URL token masking)
        - EventBreadcrumbs (ReportsBreadcrumb events)
        - Install (plugin:install, lib/config/sentry.dart)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - macOS
        - Windows
        - Linux
        - Not platform-specific
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Reproduction Code
      description: The smallest snippet that shows the problem.
      render: dart

  - type: input
    id: plugin-version
    attributes:
      label: magic_sentry Version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: magic-version
    attributes:
      label: Magic Framework Version
      placeholder: "0.0.29"
    validations:
      required: true

  - type: input
    id: sentry-version
    attributes:
      label: sentry_flutter Version
      placeholder: "10.3.0"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter Version
      placeholder: "3.47.0"
    validations:
      required: true

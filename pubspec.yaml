name: magic_sentry
description: "Sentry for Magic apps: web-safe boot before Magic.init, HTTP failure reports, auth-synced user scope and URL token masking. Inert without a DSN."
version: 0.0.7
homepage: https://anilcancakir.com/magic_sentry
repository: https://github.com/anilcancakir/magic_sentry
issue_tracker: https://github.com/anilcancakir/magic_sentry/issues

topics:
  - sentry
  - error-monitoring
  - crash-reporting
  - observability
  - magic

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Auth.stateNotifier and MagicRouter.instance.addObserver land at 0.0.21;
  # Event.listenAny and ReportsBreadcrumb, which the event breadcrumbs need,
  # land at 0.0.22. The token scrubber reads
  # MagicRouter.allRoutes, which first ships in 0.0.29, the floor.
  magic: ^0.0.29
  sentry_flutter: ^10.3.0
  sentry_dio: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0
